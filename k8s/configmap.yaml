# Non-secret configuration only. Real credentials (API keys, DB password,
# Firebase private key, RSA keys) live in a Secret instead — see
# secret.example.yaml for the template and k8s/README.md for how to create
# the real one (never committed to this repo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: porza-proxy-config
  namespace: porza-proxy
data:
  PORT: "3000"
  NODE_ENV: "production"

  # Postgres/Redis run natively on this same host, outside the cluster —
  # reachable via 127.0.0.1 only because the pod uses hostNetwork: true
  # (see deployment.yaml). If either ever moves onto its own node/pod, these
  # need to change to that Service's DNS name instead.
  PG_HOST: "127.0.0.1"
  PG_PORT: "5432"
  REDIS_HOST: "127.0.0.1"
  REDIS_PORT: "6379"

  CORENIO_BASE_URL: "https://api.corenio.com"
  END_POINT: "https://ci120.s02.corenio.com"
  BRAND_LOGO_URL: "https://zoekonderdeel.nl/assets/modules/mod_ecommerce/brand_icons/[BRAND_ID].png"
  CUSTOMER_CARE_NUMBER: "0854011901"
  PUBLIC_API_BASE_URL: "https://zagsdev.nl"
  SERVER_URL: "https://zagsdev.nl"
  MAX_TABS: "3"

  # Secret volume mount paths (see deployment.yaml's volumeMounts) — not
  # secret values themselves, just where the mounted key files land.
  RSA_PUBLIC_KEY_PATH: "/etc/secrets/public.pem"
  RSA_PRIVATE_KEY_PATH: "/etc/secrets/private.pem"
