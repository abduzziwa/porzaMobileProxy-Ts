# TEMPLATE ONLY — copy this to secret.yaml, fill in real values, apply it
# directly with `kubectl apply -f secret.yaml`, and NEVER commit that file
# (secret.yaml is gitignored — see .gitignore). This example file only
# documents which keys the app actually reads from the environment.
apiVersion: v1
kind: Secret
metadata:
  name: porza-proxy-secrets
  namespace: porza-proxy
type: Opaque
stringData:
  API_KEY: "REPLACE_ME"
  AUTH_CREDENTIALS: "REPLACE_ME"
  CORENIO_API_KEY: "REPLACE_ME"
  ENCRYPTION_KEY: "REPLACE_ME"
  INTERNAL_NOTIFICATIONS_API_KEY: "REPLACE_ME"

  PG_DB: "REPLACE_ME"
  PG_USER: "REPLACE_ME"
  PG_PASSWORD: "REPLACE_ME"

  FIREBASE_PROJECT_ID: "REPLACE_ME"
  FIREBASE_CLIENT_EMAIL: "REPLACE_ME"
  FIREBASE_PRIVATE_KEY: "REPLACE_ME"

  TYPESENSE_API_KEY: "REPLACE_ME"
  TYPESENSE_BASE_URL: "REPLACE_ME"
  TYPESENSE_CID: "REPLACE_ME"
  TYPESENSE_HASH: "REPLACE_ME"
---
# RSA keypair — mounted as files (see deployment.yaml), not env vars, since
# the app reads them from disk via RSA_PUBLIC_KEY_PATH/RSA_PRIVATE_KEY_PATH.
# Create with:
#   kubectl create secret generic porza-proxy-rsa-keys -n porza-proxy \
#     --from-file=public.pem=./public.pem --from-file=private.pem=./private.pem
apiVersion: v1
kind: Secret
metadata:
  name: porza-proxy-rsa-keys
  namespace: porza-proxy
type: Opaque
stringData:
  public.pem: "REPLACE_ME"
  private.pem: "REPLACE_ME"
