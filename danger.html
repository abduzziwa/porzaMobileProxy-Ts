<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ACCESS DENIED</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle, #0a0a0a, #000);
        color: #ff3b3b;
        font-family: "Courier New", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .container {
        border: 2px solid #ff3b3b;
        padding: 40px;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
        animation: flicker 2s infinite;
      }

      h1 {
        font-size: 3rem;
        letter-spacing: 4px;
      }

      p {
        color: #f2f2f2;
        line-height: 1.6;
      }

      .danger {
        margin-top: 20px;
        font-size: 1.3rem;
        font-weight: bold;
      }

      @keyframes flicker {
        0% {
          opacity: 1;
        }
        5% {
          opacity: 0.7;
        }
        10% {
          opacity: 1;
        }
        15% {
          opacity: 0.5;
        }
        20% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>ACCESS DENIED</h1>
      <p id="track"></p>
      <p>
        You are not supposed to be here.<br /><br />
        This area is restricted and monitored.<br />
        All activity is being logged.
      </p>
      <div class="danger">Leave now — staying longer is a mistake.</div>
    </div>

    <!-- Alarm sound -->
    <audio id="alarm" loop>
      <source src="/alarm.mp3" type="audio/mpeg" />
      Your browser does not support audio.
    </audio>

    <script>
      // Text delay effect
      setTimeout(() => {
        document.getElementById("track").innerText =
          "Connection logged. Monitoring activity...";
      }, 1500);

      // Play alarm on first interaction (browser safe)
      const alarm = document.getElementById("alarm");

      function startAlarm() {
        alarm.volume = 1.0;
        alarm.play().catch(() => {});
        document.removeEventListener("click", startAlarm);
        document.removeEventListener("keydown", startAlarm);
      }

      document.addEventListener("click", startAlarm);
      document.addEventListener("keydown", startAlarm);
    </script>
  </body>
</html>
